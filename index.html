  .logo b{color:var(--accent)}
  .lead{color:var(--muted);margin:8px 0 22px;line-height:1.8;font-size:15px}
  .pw{position:relative}
  .pw input{width:100%;font:inherit;font-size:17px;color:var(--ink);background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);
    border-radius:14px;padding:14px 16px 14px 48px;outline:0;direction:ltr;text-align:right}
  .pw input:focus{border-color:var(--accent)}

  label.rem{display:flex;align-items:center;gap:10px;justify-content:flex-start;margin:4px 2px 16px;color:var(--muted);font-size:15px;cursor:pointer}

  .go:disabled{opacity:.6}
  .spin{width:2.2rem;height:2.2rem;border:.25em solid var(--muted);border-left-color:transparent;border-radius:50%;animation:s .75s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}

    document.getElementById("staticrypt_loading").classList.add("hidden");
    document.getElementById("staticrypt_content").classList.remove("hidden");
    document.getElementById("staticrypt-password").focus();
    if (isRememberEnabled) document.getElementById("staticrypt-remember-label").classList.remove("hidden");
  }
};
const eye = document.querySelector(".eye"), pwIn = document.getElementById("staticrypt-password");
function toggleEye() {
  const show = pwIn.type === "password";
  pwIn.type = show ? "text" : "password";
  eye.alt = eye.title = show ? templateToggleAltHide : templateToggleAltShow;
  eye.style.opacity = show ? "1" : ".7";
}
eye.addEventListener("click", toggleEye);
eye.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleEye(); } });
pwIn.addEventListener("input", () => { document.getElementById("staticrypt-error").textContent = ""; });
document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
  e.preventDefault();
  const go = document.getElementById("staticrypt-go"), err = document.getElementById("staticrypt-error");
  go.disabled = true; err.textContent = "";
  const { isSuccessful } = await staticrypt.handleDecryptionOfPage(pwIn.value, document.getElementById("staticrypt-remember").checked);
  if (!isSuccessful) { err.textContent = templateError; go.disabled = false; pwIn.select(); }
});
</script>
</body>
